name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The JavaScript tests are run through pytest as well, and they skip when
      # node is absent. Installing node here is what stops that skip from being
      # mistaken for a pass.
      - run: node --version
      - run: pip install -e .[dev]
      - run: python -m pytest -v
