<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>meshmark</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
</script>
</head>
<body>

<script>
/* Anything that goes wrong before the app is running would otherwise leave the
   page sitting on its last progress message forever, which reads as a hang. A
   module with top-level await turns a throw into an unhandled rejection, so both
   are caught here, and both are put on the screen rather than only in a console
   nobody has open. */
window.__meshmarkErrors = [];
(function () {
  function report(err) {
    window.__meshmarkErrors.push(String((err && err.stack) || err));
    var el = document.getElementById('loading');
    if (!el) return;
    el.className = 'error';
    el.textContent = String((err && err.message) || err);
  }
  addEventListener('error', function (e) { report(e.error || e.message); });
  addEventListener('unhandledrejection', function (e) { report(e.reason); });
})();
</script>

<div id="view">
  <div id="loading"></div>
</div>

<header>
  <h1>meshmark</h1>
  <span class="sub" id="baseline"></span>
  <span class="tools">
    <button id="langbtn" class="mini" title="English / 中文"></button>
    <button id="helpbtn" class="mini"></button>
  </span>
</header>

<div id="panel">
  <div class="card">
    <h2 data-i18n="view.title"></h2>
    <div class="slider-row">
      <span data-i18n="view.cut"></span>
      <input type="range" id="cut" min="0.2" max="4.0" step="0.05" value="1.6">
      <span class="num"><span id="cutval">1.60</span> m</span>
    </div>
    <label class="check">
      <input type="checkbox" id="showrefs" checked> <span data-i18n="list.showRefs"></span>
    </label>
    <label class="check">
      <input type="checkbox" id="focuscur"> <span data-i18n="list.focusCur"></span>
    </label>
    <div class="row"><button id="framebtn" style="flex:1" data-i18n="view.frame"></button></div>
  </div>

  <div class="card">
    <h2 data-i18n="add.title"></h2>
    <select id="cls"></select>
    <div class="row"><button id="addbtn" style="flex:1"></button></div>
    <small data-i18n-html="add.hint"></small>
  </div>

  <div class="card">
    <h2 data-i18n="routes.title"></h2>
    <select id="routesel"></select>
    <div class="row">
      <button id="pathbtn" style="flex:1"></button>
      <button id="undobtn" data-i18n="routes.undo"></button>
    </div>
    <div class="row">
      <button id="routenew" data-i18n="routes.new"></button>
      <button id="routerename" data-i18n="routes.rename"></button>
      <button id="routedel" class="warn" data-i18n="routes.delete"></button>
    </div>
    <small id="pathinfo"></small>
    <small id="refinfo"></small>
  </div>

  <div class="card" id="listcard">
    <h2>
      <span data-i18n="list.title"></span>
      <span id="progress" class="soft"></span>
    </h2>
    <div class="tabs">
      <button data-f="all" data-i18n="list.all"></button>
      <button data-f="reference" data-i18n="list.refs"></button>
      <button data-f="added" data-i18n="list.added"></button>
    </div>
    <div id="list"></div>
  </div>

  <div class="card">
    <div class="row">
      <button class="primary" id="exportbtn" data-i18n="io.export"></button>
      <button id="importbtn" data-i18n="io.import"></button>
      <button class="warn" id="resetbtn" data-i18n="io.reset"></button>
      <input id="imp" type="file" accept="application/json" hidden>
    </div>
    <small data-i18n="io.autosave"></small>
  </div>
</div>

<div id="right">
<div class="card" id="inset">
  <h2 data-i18n="topdown.title"></h2>
  <canvas id="topdown"></canvas>
  <small id="scale"></small>
</div>

<div class="card" id="editcard">
  <div id="title" class="mono"></div>
  <div id="lbl"></div>
  <select id="relabel"></select>
  <small id="lblnote"></small>

  <table class="fields">
    <tr>
      <td data-i18n="obj.cx"></td><td><input type="number" id="cx" step="0.01"></td>
      <td data-i18n="obj.cy"></td><td><input type="number" id="cy" step="0.01"></td>
    </tr>
    <tr>
      <td data-i18n="obj.w"></td><td><input type="number" id="w" step="0.05" min="0.05"></td>
      <td data-i18n="obj.d"></td><td><input type="number" id="d" step="0.05" min="0.05"></td>
    </tr>
    <tr>
      <td data-i18n="obj.yaw"></td><td><span id="yawv" class="num"></span></td>
      <td data-i18n="obj.h"></td><td><input type="number" id="h" step="0.05" min="0.05"></td>
    </tr>
    <tr><td colspan="4"><input type="range" id="yaw" min="-90" max="90" step="1" value="0"></td></tr>
  </table>

  <div class="kv" id="readout"></div>

  <div class="row">
    <button class="primary" id="acceptbtn" data-i18n="obj.accept"></button>
    <button id="confirmbtn" data-i18n="obj.confirm"></button>
    <button class="warn" id="absentbtn" data-i18n="obj.absent"></button>
    <button id="clearbtn" data-i18n="obj.clear"></button>
  </div>
  <div class="row nav">
    <button id="prevbtn" data-i18n="obj.prev"></button>
    <span id="navpos"></span>
    <button id="nextbtn" data-i18n="obj.next"></button>
  </div>

  <textarea id="note"></textarea>
</div>
</div>

<div class="card" id="helpcard">
  <button class="close" id="helpclose"></button>
  <h2 data-i18n="help.title"></h2>
  <small data-i18n-html="help.body"></small>
</div>

<div id="hint" data-i18n-html="help.pill"></div>
<div class="hud" id="hud"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
