[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshmark"
version = "0.2.0"
description = "Hand-annotate objects and routes in a scanned room, in your browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siiichenggg" }]
keywords = ["annotation", "3d", "mesh", "photogrammetry", "robotics", "ground-truth"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# None. The bundle is static files plus a copy of three.js, and the server is
# http.server -- a tool for annotating one room should not drag in a web stack.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Siiichenggg/meshmark"
Issues = "https://github.com/Siiichenggg/meshmark/issues"

[project.scripts]
meshmark = "meshmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meshmark = ["web/*", "presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
